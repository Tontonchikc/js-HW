<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Practice</title>
  </head>

  <body>
    <main>
      <section>
        <h2>Завдання 1</h2>

        <input type="text" id="inputText" />

        <button id="myButton">Стара кнопка</button>
      </section>

      <section>
        <h2>Завдання 2</h2>

        <h3>Моє зображення</h3>

        <img
          id="myImage"
          src="https://via.placeholder.com/150"
          width="150"
          alt="Старе зображення"
        />
      </section>

      <section>
        <h2>Завдання 3</h2>

        <a id="myLink" href="https://google.com">Перейти</a>

        <img
          id="linkImage"
          src="https://via.placeholder.com/200"
          width="200"
        />
      </section>

      <section>
        <h2>Завдання 4</h2>

        <ul id="myList">
          <li>Старий текст</li>
          <li>Другий елемент</li>
          <li>Третій елемент</li>
        </ul>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
